name: Desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --windowed --name SkyMind --collect-all pybullet skymind/desktop_entry.py
      - run: python -c "import subprocess,sys; from pathlib import Path; exe=Path('dist/SkyMind')/('SkyMind.exe' if sys.platform=='win32' else 'SkyMind'); subprocess.run([str(exe.resolve()),'--smoke-test'],check=True,timeout=60)"
      - run: tar -czf SkyMind-${{ runner.os }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: SkyMind-${{ matrix.os }}
          path: SkyMind-*.tar.gz
